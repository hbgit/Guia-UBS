name: guia_ubs
description: "Guia UBS — orientação sobre serviços da Atenção Básica, offline-first."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  # i18n pt/es (RF-01). As strings AQUI sao so a casca do app; todo conteudo
  # clinico vem do content.db assinado, nunca de ARB (RF-07/08/09).
  flutter_localizations:
    sdk: flutter
  meta: ^1.16.0
  # Conversão de string para a fronteira FFI do shim do llama.cpp.
  ffi: ^2.1.4
  # SHA-256 do modelo e dos pacotes de conteúdo, conferido antes de aceitar
  # qualquer artefato baixado (RNF-03 / FSM-B).
  crypto: ^3.0.6
  # Verificacao Ed25519 da assinatura do manifest (FSM-B / INV-7). Puro Dart:
  # roda igual no host e no aparelho, e nao acrescenta biblioteca nativa ao APK.
  # Usamos APENAS `verify` — o app nunca assina nada.
  cryptography: ^2.9.0

  # Leitura do content.db distribuído (somente leitura no dispositivo).
  sqlite3: ^2.4.0
  # Biblioteca nativa do SQLite embarcada no APK: não dependemos da versão
  # que o fabricante da ROM decidiu enviar.
  sqlite3_flutter_libs: ^0.5.26

  # Destino do modelo: getApplicationSupportDirectory() — armazenamento interno
  # do app, sem permissão e invisível a gerenciadores de arquivos.
  path_provider: ^2.1.5
  # Classe da rede (Wi-Fi x dados moveis) para a restricao UNMETERED.
  connectivity_plus: ^6.1.0
  # Seletor de arquivo para importar o modelo de pendrive/OTG.
  file_picker: ^12.0.0
  # Agendamento em segundo plano do download do modelo (WorkManager no Android).
  workmanager: ^0.10.0
  # Navegacao declarativa: a arvore de rotas e a prova de "profundidade <= 4,
  # zero dead-ends" (CAP-02) — um teste consegue percorre-la.
  go_router: ^17.5.0
  # TTS pelo engine do SO. Modulo FOLHA: falha nunca propaga (INV-8). ROMs
  # cortadas sem engine sao um risco previsto (A3) — o app fica so visual.
  flutter_tts: ^4.2.5
  # Exigido pelo gen-l10n do Flutter.
  intl: ^0.20.2
  # Estado da UI (stack.md 1). Aqui usamos providers escritos a mao; o sabor
  # com codegen + freezed entra no item 12, onde a triagem tem estados que
  # realmente se beneficiam de union exaustiva.
  #
  # Fixado no 2.x: o 3.x resolve, mas so subindo 31 pacotes junto por causa das
  # restricoes atuais. Trocar de major na CASCA, antes de existir tela que use
  # o estado, seria pagar a migracao duas vezes — a hora de reavaliar e no
  # item 12, quando a triagem for escrita.
  flutter_riverpod: ^2.6.1
  # user.db — preferencias do aparelho (stack.md §2). NAO guarda dado clinico:
  # a sequencia de sintomas morre em memoria (INV-2 / LGPD-RF13). O esquema usa
  # colunas TIPADAS de proposito, e nao chave-valor: as colunas sao a lista
  # exaustiva do que o app persiste, e um teste as enumera. Com chave-valor,
  # "o que guardamos sobre o usuario" deixaria de ser verificavel estaticamente.
  drift: ^2.31.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Verifica no aparelho o que o host não alcança: se o `.so` do shim carrega
  # dentro do APK (integration_test/native_shim_test.dart).
  #
  # ARMADILHA: este pacote registra um plugin Android. Um `flutter build apk
  # --release` logo após um build debug falha com "package
  # dev.flutter.plugins.integration_test does not exist" — o registrant gerado
  # no debug (que inclui dev dependencies) é reaproveitado. Apagar
  # `android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java`
  # resolve; ele é regenerado no build seguinte.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Lê a suite golden clínica nos testes (mesmo arquivo que o packer usa).
  yaml: ^3.1.2
  # Codegen do Drift. Os arquivos .g.dart nao sao versionados — ver .gitignore.
  drift_dev: ^2.31.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  # Gera as classes de i18n a partir de lib/l10n/*.arb (ver l10n.yaml).
  generate: true
