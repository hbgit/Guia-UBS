# Guarda do contrato: garante que os JSON Schemas publicados correspondem
# exatamente a fonte em contract/src/. Um schema alterado sem regenerar quebra
# aqui, antes de chegar ao app (stack.md 3.3).

name: contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # O `tsx` (esbuild) apaga tipo sem conferir: um import duplicado passou
      # despercebido ate o item 18 porque `tsc` nunca rodava aqui. Teste verde
      # com tipo quebrado e o pior dos dois mundos — parece verificado.
      - name: Verificacao de tipos
        run: npm run typecheck

      - name: Testes do contrato
        run: npm test

      - name: Schemas gerados estao em dia
        run: |
          npm run contract:generate
          if ! git diff --exit-code -- contract/; then
            echo "::error::JSON Schemas desatualizados. Rode 'npm run contract:generate' e commite."
            exit 1
          fi

      - name: Auditoria de dependencias
        run: npm audit --audit-level=high

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Portoes clinicos sem assinar: --dry-run nao toca em chave alguma.
      # Falso negativo na suite golden reprova o PR (PRD risco R5).
      - name: Portoes do pacote de conteudo
        run: npm run pack:check

      - name: Placeholders de asset em dia com 000_assets.sql
        run: |
          node seed/assets/generate-placeholders.mjs
          git diff --exit-code -- seed/assets/

  # Guarda do banco master do plano de controle (arquitetura.md 4.3).
  #
  # Os TESTES do cms ja rodam no job `contract`, porque `npm test` percorre os
  # workspaces. O que este job acrescenta e o diff-check dos artefatos gerados:
  # migracao e gatilhos sao produzidos por comando, e schema alterado sem
  # regenerar e o defeito que nao aparece em teste nenhum — o banco de teste
  # nasce do arquivo antigo e passa.
  #
  # `git add --intent-to-add` nao e detalhe: `git diff` IGNORA arquivo nao
  # rastreado, e migracao nova nasce exatamente assim. Sem ele, quem alterasse o
  # schema e esquecesse `cms:generate` passaria no CI.
  cms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Migracao e gatilhos estao em dia
        run: |
          npm run cms:generate
          npm run cms:triggers
          git add --intent-to-add --all cms/
          if ! git diff --exit-code -- cms/; then
            echo "::error::Schema do CMS fora de sincronia. Rode 'npm run cms:generate' e 'npm run cms:triggers' e commite."
            exit 1
          fi

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compose valido
        working-directory: infra
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config --quiet
          # O override tambem: ate o item 24 ele nunca era validado, e um erro
          # ali so aparece na maquina de quem esta desenvolvendo.
          docker compose -f compose.yaml -f compose.override.yaml config --quiet

      # O Caddyfile nunca foi conferido em lugar nenhum ate o item 24. Erro de
      # sintaxe ali so aparece quando o `edge` reinicia — em producao, com o
      # servico ja fora do ar.
      - name: Caddyfile valido
        working-directory: infra
        env:
          CONTENT_DOMAIN: conteudo.exemplo.invalid
          CMS_DOMAIN: cms.exemplo.invalid
          ACME_EMAIL: ops@exemplo.invalid
        run: |
          docker run --rm -e CONTENT_DOMAIN -e CMS_DOMAIN -e ACME_EMAIL \
            -v "$PWD:/w:ro" caddy:2.9-alpine caddy validate --config /w/Caddyfile
          docker run --rm -v "$PWD:/w:ro" caddy:2.9-alpine \
            caddy validate --config /w/Caddyfile.dev
